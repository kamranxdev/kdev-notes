<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Neobrutalist Shadow -->
  <rect x="14" y="14" width="76" height="76" rx="16" fill="#000000" />
  
  <!-- Main Accent Box (Page) -->
  <rect x="10" y="10" width="76" height="76" rx="16" fill="#c9fd74" stroke="#000000" stroke-width="6" />
  
  <!-- Binder Seam/Margin Line -->
  <line x1="26" y1="10" x2="26" y2="86" stroke="#000000" stroke-width="4" />
  
  <!-- Terminal / Code Symbol (Shifted right for balance) -->
  <path d="M38 35 L54 50 L38 65" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="58" y1="65" x2="74" y2="65" stroke="#000000" stroke-width="8" stroke-linecap="round" />
  
  <!-- Binder Rings (Looping around the left edge) -->
  <rect x="2" y="20" width="14" height="8" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <rect x="2" y="33" width="14" height="8" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <rect x="2" y="46" width="14" height="8" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <rect x="2" y="59" width="14" height="8" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <rect x="2" y="72" width="14" height="8" rx="4" fill="#ffffff" stroke="#000000" stroke-width="3" />
</svg>